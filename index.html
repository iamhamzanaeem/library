<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="newBook">New Book</button>
    <form class="newBookForm">
        <button class="x-btn">x</button>
        <label for="title">Title:</label>
        <input type="text" id="title" required/>
        <label for="author">Author:</label>
        <input type="text" id="author" required/>
        <label for="pages">Pages: </label>
        <input type="number" id="pages" required/>
        <label for="readStatus">
            Read / Unread
            <input type="checkbox" id="readStatus"/>
            <span>(check this if you already read this Book)</span>
        </label>
        <button type="submit" class="submitBtn">Submit Form</button>
    </form>
    <div class="library"></div>
    <script src="script.js"></script>
</body>

</html>
